  <head>
    <script>
      // AI Studio preview environment runs behind proxy without HMR WebSocket.
      // Ignore WebSocket connection errors as specified by environment guidelines.
      (function() {
        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = (typeof arg === 'string' ? arg : (arg && (arg.message || arg.stack || String(arg)))) || '';
            if (
              str.indexOf('WebSocket') !== -1 ||
              str.indexOf('websocket') !== -1 ||
              str.indexOf('WebSocket closed without opened') !== -1 ||
              (str.indexOf('[vite]') !== -1 && str.indexOf('connect') !== -1)
            ) {
              return;
            }
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = (typeof arg === 'string' ? arg : (arg && (arg.message || arg.stack || String(arg)))) || '';
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
              return;
            }
          }
          return origWarn.apply(console, arguments);
        };
      })();

      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || (e.error && e.error.message))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('vite') !== -1) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var msg = (e && e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('vite') !== -1) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
